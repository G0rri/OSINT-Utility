[project]
name = "osint-utility"
version = "2.0.0"
description = "Suite OSINT modular y asíncrona con interfaz gráfica"
requires-python = ">=3.10"
readme = "README.md"
# license = { text = "..." }  # pendiente: elegir licencia y añadir el fichero LICENSE

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff.lint]
# Conjunto explícito: sin esto, el comportamiento cambia entre versiones de ruff.
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "ASYNC",  # errores propios de asyncio
    "RUF",
]
ignore = [
    "E501",   # longitud de línea: la gestiona el formateador
    "RUF001", # símbolos unicode decorativos (ℹ, ×, ⚡) en la salida de consola
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# main.py debe cargar el .env antes de importar los módulos que leen su entorno.
"main.py" = ["E402"]
# Las pruebas acceden a atributos internos a propósito.
"tests/*" = ["SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
